[project]
name = "gbif-mcp"
version = "0.7.2"
description = "MCP-connector voor Belgische biodiversiteitsdata: GBIF-waarnemingen, Vlaamse Rode Lijsten, Soortenbesluit, Habitat- en Vogelrichtlijnbijlagen, Unielijst invasieve soorten en INBO-soortenlijsten."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pillow>=10.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
gbif-mcp = "gbif_mcp.server:main"
gbif-mcp-http = "gbif_mcp.http_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gbif_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: rooktest tegen de echte GBIF-/INBO-diensten (draait niet standaard; `pytest -m live`)"]
addopts = "-m 'not live'"
